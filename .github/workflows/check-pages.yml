name: check-pages

# The docs site had no CI at all, so three representations of the same content
# (visible headings, the table of contents, the JSON-LD schema) drifted apart
# unnoticed. Pages builds and serves whatever is committed, valid or not.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural checks (stdlib only, no install step needed)
        run: python3 scripts/check-pages.py
